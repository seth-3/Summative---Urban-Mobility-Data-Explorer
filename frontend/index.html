<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Mobility Dashboard</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <aside class="rail">
    <h2 class="logo">NYC Mobility</h2>
    <nav class="rail-nav">
      <button id="nav-avg" class="btn" data-target="#avg-card">Avg</button>
      <button id="nav-top" class="btn" data-target="#calendar-card">Top</button>
      <button id="nav-donut" class="btn" data-target="#donut-card">Avg$</button>
      <button id="nav-bars" class="btn" data-target="#bars-card">Month</button>
    </nav>
    <div class="rail-filters">
      <button id="filter-7" class="btn small" data-days="7">7d</button>
      <button id="filter-30" class="btn small" data-days="30">30d</button>
      <button id="filter-90" class="btn small" data-days="90">90d</button>
      <button id="filter-reset" class="btn small" data-days="">All</button>
    </div>
    <div class="rail-custom">
      <details>
        <summary>Custom filters</summary>
        <div class="grid2">
          <label>Min km<input id="min_distance" type="number" step="0.1"></label>
          <label>Max km<input id="max_distance" type="number" step="0.1"></label>
          <label>Min km/h<input id="min_speed" type="number" step="0.1"></label>
          <label>Max km/h<input id="max_speed" type="number" step="0.1"></label>
          <label>Min $<input id="min_fare" type="number" step="0.1"></label>
          <label>Max $<input id="max_fare" type="number" step="0.1"></label>
          <label>Cell<input id="cell" type="text" placeholder="x:y"></label>
          <label>Hour start<input id="hod_start" type="number" min="0" max="23"></label>
          <label>Hour end<input id="hod_end" type="number" min="0" max="23"></label>
        </div>
        <div class="row gap">
          <button id="apply-custom" class="btn small">Apply</button>
          <button id="clear-custom" class="btn small">Clear</button>
        </div>
      </details>
    </div>
  </aside>
  <main class="wrap">
    <div id="no-data" class="notice" hidden>No data available for the selected range.</div>
    <section class="card dark" id="avg-card">
      <header>
        <h3>Average metrics</h3>
        <div>
          <div class="metric" id="avg-trip">0 trips</div>
          <div class="muted" id="range-note"></div>
        </div>
      </header>
      <canvas id="lineChart" height="140"></canvas>
    </section>

    <section class="card" id="calendar-card">
      <header>
        <h3>Top pickup cells</h3>
      </header>
      <div class="list-head"><span>Cell</span><span>Trips</span></div>
      <ul id="top-cells"></ul>
    </section>

    <section class="card" id="donut-card">
      <header>
        <h3>Avg speed / fare per km</h3>
      </header>
      <div class="two">
        <div class="big" id="avg-speed">0 km/h</div>
        <div class="big" id="avg-fpk">$0/km</div>
      </div>
    </section>

    <section class="card" id="bars-card">
      <header>
        <h3>Monthly trips</h3>
      </header>
      <canvas id="barChart" height="120"></canvas>
    </section>
  </main>
  <script src="/assets/charts.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
